body:
  - type: markdown
    attributes:
      value: |
        Share an idea and talk it through with others. Once an idea is clear, it can become a
        [feature request](https://github.com/Ashif3hq/molCanvas/issues/new/choose). Check the
        [roadmap](https://github.com/Ashif3hq/molCanvas#roadmap) first.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like MolCanvas to do, and what problem does it solve?
    validations:
      required: true
  - type: textarea
    id: who
    attributes:
      label: Who would it help?
      description: For example organic chemists, polymer chemists, students, teachers.
  - type: textarea
    id: references
    attributes:
      label: Examples or references (optional)
