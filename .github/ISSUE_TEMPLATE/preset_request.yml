name: Preset request
description: Ask for a molecule, monomer, polymer repeat unit or functional group to be added to the library.
labels: ["preset"]
body:
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: e.g. Poly(lactic acid), Methyl methacrylate
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Molecule
        - Monomer
        - Polymer repeat unit
        - Functional group
        - Other
    validations:
      required: true
  - type: input
    id: smiles
    attributes:
      label: SMILES
      description: For a repeat unit, mark the two attachment points (for example with `*`).
      placeholder: e.g. CC(=C)C(=O)OC
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: Reference
      description: A PubChem link, CAS number or literature reference that confirms the structure.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](https://github.com/Ashif3hq/molCanvas/blob/main/CODE_OF_CONDUCT.md).
          required: true
