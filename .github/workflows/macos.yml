name: macOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # macos-latest runs on Apple Silicon, so this produces a native arm64 (M1–M5) build.
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run check:presets
      - run: npm run check:solubility
      - run: npm run check:export
      - run: npm run check:cdxml
      - run: npm run check:radicals

      - name: Build app and DMG
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target aarch64-apple-darwin
          # On a version tag, or when run by hand from the Actions tab, also create a draft
          # GitHub release (tagged with the app version from tauri.conf.json) with the .dmg attached.
          tagName: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && 'v__VERSION__' || '' }}
          releaseName: MolCanvas v__VERSION__
          releaseBody: Native Apple Silicon build. See How-to-install-MolCanvas-on-Mac.txt.
          releaseDraft: true

      # The release page and an attached text file both carry the install guide from docs/INSTALL-macOS.md.
      - name: Add install guide to the release
        if: steps.tauri.outputs.releaseId != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: https://api.github.com/repos/${{ github.repository }}/releases/${{ steps.tauri.outputs.releaseId }}
          UPLOAD: https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.tauri.outputs.releaseId }}/assets
          NAME: How-to-install-MolCanvas-on-Mac.txt
        run: |
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          jq -n --rawfile body docs/INSTALL-macOS.md '{body: $body}' | curl -fsS -X PATCH "${auth[@]}" "$RELEASE" -d @- > /dev/null
          for id in $(curl -fsS "${auth[@]}" "$RELEASE/assets" | jq -r --arg n "$NAME" '.[] | select(.name == $n) | .id'); do
            curl -fsS -X DELETE "${auth[@]}" "https://api.github.com/repos/${{ github.repository }}/releases/assets/$id"
          done
          curl -fsS -X POST "${auth[@]}" -H "Content-Type: text/plain" --data-binary @docs/INSTALL-macOS.md "$UPLOAD?name=$NAME" > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: MolCanvas-macOS-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
