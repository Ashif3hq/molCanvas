name: macOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # macos-latest runs on Apple Silicon, so this produces a native arm64 (M1–M5) build.
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run check:presets
      - run: npm run check:solubility
      - run: npm run check:export
      - run: npm run check:cdxml
      - run: npm run check:radicals

      - name: Build app and DMG
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target aarch64-apple-darwin
          # On a version tag, or when run by hand from the Actions tab, also create a draft
          # GitHub release (tagged with the app version from tauri.conf.json) with the .dmg attached.
          tagName: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && 'v__VERSION__' || '' }}
          releaseName: MolCanvas v__VERSION__
          releaseBody: Native Apple Silicon build. First launch - right-click MolCanvas.app and choose Open (the app is not notarised yet).
          releaseDraft: true

      - uses: actions/upload-artifact@v4
        with:
          name: MolCanvas-macOS-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
