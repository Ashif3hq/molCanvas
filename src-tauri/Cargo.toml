[package]
name = "molcanvas"
version = "0.3.0"
description = "MolCanvas: a free, modern chemical structure editor"
authors = ["Ashif"]
license-file = "../LICENSE"
edition = "2021"

[lib]
name = "molcanvas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
